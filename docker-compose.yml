services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: intellivault-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: intellivault
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: